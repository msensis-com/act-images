---
# Port of java-tools.sh: Temurin JDKs from the toolset, Ant, Maven, Gradle and sbt.
- name: Load toolset
  ansible.builtin.include_role:
    name: toolset

- name: Add Adoptium repository key
  ansible.builtin.shell: |
    set -o pipefail
    wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor > /usr/share/keyrings/adoptium.gpg
  args:
    executable: /bin/bash
  changed_when: true

- name: Add Adoptium repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/adoptium.list
    mode: "0644"
    content: >
      deb [signed-by=/usr/share/keyrings/adoptium.gpg]
      https://packages.adoptium.net/artifactory/deb/ {{ ansible_facts['distribution_release'] }} main

- name: Install Temurin JDKs
  ansible.builtin.include_tasks: jdk.yml
  loop: "{{ toolset_data.java.versions }}"
  loop_control:
    loop_var: java_version

- name: Install Ant
  ansible.builtin.apt:
    name: [ant, ant-optional]
    install_recommends: false

- name: Set ANT_HOME
  ansible.builtin.include_role:
    name: envfile
    tasks_from: set
  vars:
    envfile_name: ANT_HOME
    envfile_value: /usr/share/ant

- name: Install Maven
  vars:
    java_tools_maven_version: "3.10.0"
  block:
    - name: Download Maven {{ java_tools_maven_version }}
      ansible.builtin.get_url:
        url: "https://archive.apache.org/dist/maven/maven-3/{{ java_tools_maven_version }}/binaries/apache-maven-{{ java_tools_maven_version }}-bin.zip"
        dest: /tmp/maven.zip
        mode: "0644"

    - name: Extract Maven
      ansible.builtin.command:
        cmd: unzip -qq -d /usr/share /tmp/maven.zip
        creates: "/usr/share/apache-maven-{{ java_tools_maven_version }}"

    - name: Link mvn
      ansible.builtin.file:
        src: "/usr/share/apache-maven-{{ java_tools_maven_version }}/bin/mvn"
        dest: /usr/bin/mvn
        state: link

- name: Look up latest stable Gradle
  ansible.builtin.uri:
    url: https://services.gradle.org/versions/current
  register: java_tools_gradle_current

- name: Pick Gradle release
  ansible.builtin.set_fact:
    java_tools_gradle: "{{ java_tools_gradle_current.json }}"

- name: Download Gradle {{ java_tools_gradle.version }}
  ansible.builtin.get_url:
    url: "{{ java_tools_gradle.downloadUrl }}"
    dest: /tmp/gradleLatest.zip
    mode: "0644"

- name: Extract Gradle
  ansible.builtin.command:
    cmd: unzip -qq -d /usr/share /tmp/gradleLatest.zip
    creates: "/usr/share/gradle-{{ java_tools_gradle.version }}"

- name: Link gradle
  ansible.builtin.file:
    src: "/usr/share/gradle-{{ java_tools_gradle.version }}/bin/gradle"
    dest: /usr/bin/gradle
    state: link

- name: Set GRADLE_HOME
  ansible.builtin.include_role:
    name: envfile
    tasks_from: set
  vars:
    envfile_name: GRADLE_HOME
    envfile_value: "/usr/share/gradle-{{ java_tools_gradle.version }}"

- name: Remove Adoptium repository and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/adoptium.list
    - /usr/share/keyrings/adoptium.gpg

- name: Add sbt repositories
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}\n"
    mode: "0644"
  loop:
    - { dest: /etc/apt/sources.list.d/sbt.list, content: "deb https://repo.scala-sbt.org/scalasbt/debian all main" }
    - { dest: /etc/apt/sources.list.d/sbt_old.list, content: "deb https://repo.scala-sbt.org/scalasbt/debian /" }

- name: Add sbt repository key
  ansible.builtin.shell: |
    set -o pipefail
    curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" \
      | gpg --no-default-keyring --keyring gnupg-ring:/etc/apt/trusted.gpg.d/scalasbt-release.gpg --import
    chmod 644 /etc/apt/trusted.gpg.d/scalasbt-release.gpg
  args:
    executable: /bin/bash
  changed_when: true

- name: Install sbt
  ansible.builtin.apt:
    name: sbt
    update_cache: true
