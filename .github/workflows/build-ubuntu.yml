name: Build ubuntu images

on:
  schedule:
    - cron: 0 12 */7 * *
  push:
    paths:
      - '.github/workflows/build-ubuntu.yml'
      - '.github/actions/setup-build/**'
      - 'ansible/**'
      - 'justfile'
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/build-ubuntu.yml'
      - '.github/actions/setup-build/**'
      - 'ansible/**'
      - 'justfile'
  workflow_dispatch:

env:
  BUILD_OWNER: ${{ github.repository_owner }}
  BUILD_REPO: ${{ github.repository }}
  BUILD_REF: ${{ github.sha }}
  SLUG: ${{ github.repository_owner }}/ubuntu
  NODE: '20 24'
  PLATFORMS: linux/amd64,linux/arm64
  SKIP_TEST: false
  PUSH_GHCR: ${{ github.repository == (github.event.pull_request.head.repo.full_name || github.repository) && '1' || '' }}
  # PUSH_QUAY: ${{ secrets.QUAY_USER && secrets.QUAY_TOKEN && '1' || '' }}
  PUSH_DOCKER_HUB: ${{ secrets.DOCKER_USER && secrets.DOCKER_TOKEN && '1' || '' }}
  # Ubuntu version that also gets the *-latest tags
  LATEST_VERSION: 26.04
  # Used by Ansible for api.github.com lookups (rate limits); never stored in the images
  GITHUB_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  build-base:
    name: Build base ${{ matrix.TAG }}
    if: "!contains(github.event.pull_request.body, '[skip build-base]')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Login to GitHub Container Registry
        if: env.PUSH_GHCR
        run: exec buildah login -u ${{ github.actor }} -p ${{ github.token }} ghcr.io

      # - name: Login to Quay
      #   if: env.PUSH_QUAY
      #   run: exec buildah login -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }} quay.io

      - name: Login to Docker Hub
        if: env.PUSH_DOCKER_HUB
        run: exec buildah login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_TOKEN }} docker.io

      - name: Build and push act-${{ matrix.TAG }}
        env:
          RUNNER: root
        run: just ci act ${{ matrix.TAG }} docker.io/library/buildpack-deps:${{ matrix.TAG }}

      - name: Build and push runner-${{ matrix.TAG }}
        env:
          RUNNER: runner
        run: just ci runner ${{ matrix.TAG }} ghcr.io/${{ env.SLUG }}:act-${{ matrix.TAG }}-${{ env.PART_TAG }}

      - if: env.SKIP_TEST != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '^1.16'

      - if: env.SKIP_TEST != 'true'
        uses: actions/checkout@v7
        with:
          repository: nektos/act
          path: act

      - if: env.SKIP_TEST != 'true'
        env:
          ACT_SRC: ${{ github.workspace }}/act
        run: just test ghcr.io/${{ env.SLUG }}:act-${{ matrix.TAG }}-${{ env.PART_TAG }}

  build-flavours:
    name: Build ${{ matrix.TYPE }}:${{ matrix.TAG }}
    if: (!cancelled() && !failure())
    runs-on: ubuntu-latest
    needs: [build-base]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
        TYPE:
          - go
          - js
          - pwsh
          - rust
          - dotnet
          - java-tools
          - gh
          - custom
    steps:
      - name: Cleanup
        run: |
          docker rmi -f $(docker images -aq) || :
          rm -r "$RUNNER_TOOL_CACHE" || :
          rm -r "$RUNNER_TOOLSDIRECTORY" || :
          rm -r "$AGENT_TOOLSDIRECTORY" || :

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Login to GitHub Container Registry
        if: env.PUSH_GHCR
        run: exec buildah login -u ${{ github.actor }} -p ${{ github.token }} ghcr.io

      # - name: Login to Quay
      #   if: env.PUSH_QUAY
      #   run: exec buildah login -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }} quay.io

      - name: Login to Docker Hub
        if: env.PUSH_DOCKER_HUB
        run: exec buildah login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_TOKEN }} docker.io

      - name: Build and push ${{ matrix.TYPE }}-${{ matrix.TAG }}
        run: just ci ${{ matrix.TYPE }} ${{ matrix.TAG }} ghcr.io/${{ env.SLUG }}:act-${{ matrix.TAG }}-${{ env.PART_TAG }}
