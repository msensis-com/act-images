name: Build ubuntu images

on:
  schedule:
    - cron: 0 12 */7 * *
  push:
    paths:
      - '.github/workflows/build-ubuntu.yml'
      - '.github/actions/setup-build/**'
      - 'ansible/**'
      - 'justfile'
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/build-ubuntu.yml'
      - '.github/actions/setup-build/**'
      - 'ansible/**'
      - 'justfile'
  workflow_dispatch:

env:
  BUILD_OWNER: ${{ github.repository_owner }}
  BUILD_REPO: ${{ github.repository }}
  BUILD_REF: ${{ github.sha }}
  SLUG: ${{ github.repository_owner }}/ubuntu
  NODE: '20 24'
  SKIP_TEST: false
  PUSH_GHCR: ${{ github.repository == (github.event.pull_request.head.repo.full_name || github.repository) && '1' || '' }}
  # PUSH_QUAY: ${{ secrets.QUAY_USER && secrets.QUAY_TOKEN && '1' || '' }}
  PUSH_DOCKER_HUB: ${{ secrets.DOCKER_USER && secrets.DOCKER_TOKEN && '1' || '' }}
  # Ubuntu version that also gets the *-latest tags
  LATEST_VERSION: 26.04
  # Used by Ansible for api.github.com lookups (rate limits); never stored in the images
  GITHUB_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

# Each architecture is built natively on its own runner and pushed to a private staging package
# ($STAGING, tagged per run and arch); publish-* jobs then combine amd64 + arm64 into the real tags.
jobs:
  build-base:
    name: Build base ${{ matrix.TAG }} (${{ matrix.ARCH }})
    if: "!contains(github.event.pull_request.body, '[skip build-base]')"
    runs-on: ${{ matrix.ARCH == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
        ARCH:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Login to GitHub Container Registry
        run: exec buildah login -u ${{ github.actor }} -p ${{ github.token }} ghcr.io

      - name: Build act-${{ matrix.TAG }}
        env:
          RUNNER: root
        run: just ci-stage act ${{ matrix.TAG }} docker.io/library/buildpack-deps:${{ matrix.TAG }} linux/${{ matrix.ARCH }}

      - name: Build runner-${{ matrix.TAG }}
        env:
          RUNNER: runner
        run: just ci-stage runner ${{ matrix.TAG }} "$(just stage-ref act ${{ matrix.TAG }} ${{ matrix.ARCH }})" linux/${{ matrix.ARCH }}

  build-flavours:
    name: Build ${{ matrix.TYPE }}:${{ matrix.TAG }} (${{ matrix.ARCH }})
    needs: [build-base]
    if: (!cancelled())
    runs-on: ${{ matrix.ARCH == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
        TYPE:
          - go
          - js
          - pwsh
          - rust
          - dotnet
          - java-tools
          - gh
          - custom
        ARCH:
          - amd64
          - arm64
    steps:
      - name: Cleanup
        run: |
          docker rmi -f $(docker images -aq) || :
          rm -r "$RUNNER_TOOL_CACHE" || :
          rm -r "$RUNNER_TOOLSDIRECTORY" || :
          rm -r "$AGENT_TOOLSDIRECTORY" || :

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Login to GitHub Container Registry
        run: exec buildah login -u ${{ github.actor }} -p ${{ github.token }} ghcr.io

      - name: Build ${{ matrix.TYPE }}-${{ matrix.TAG }}
        run: just ci-stage ${{ matrix.TYPE }} ${{ matrix.TAG }} "$(just stage-ref act ${{ matrix.TAG }} ${{ matrix.ARCH }})" linux/${{ matrix.ARCH }}

  publish-base:
    name: Publish ${{ matrix.TYPE }}:${{ matrix.TAG }}
    needs: [build-base]
    if: (!cancelled())
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
        TYPE:
          - act
          - runner
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Login to GitHub Container Registry
        run: exec buildah login -u ${{ github.actor }} -p ${{ github.token }} ghcr.io

      # - name: Login to Quay
      #   if: env.PUSH_QUAY
      #   run: exec buildah login -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }} quay.io

      - name: Login to Docker Hub
        if: env.PUSH_DOCKER_HUB
        run: exec buildah login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_TOKEN }} docker.io

      - name: Publish ${{ matrix.TYPE }}-${{ matrix.TAG }} (amd64 + arm64)
        run: just ci-publish ${{ matrix.TYPE }} ${{ matrix.TAG }}

  publish-flavours:
    name: Publish ${{ matrix.TYPE }}:${{ matrix.TAG }}
    needs: [build-flavours]
    if: (!cancelled())
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
        TYPE:
          - go
          - js
          - pwsh
          - rust
          - dotnet
          - java-tools
          - gh
          - custom
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Login to GitHub Container Registry
        run: exec buildah login -u ${{ github.actor }} -p ${{ github.token }} ghcr.io

      # - name: Login to Quay
      #   if: env.PUSH_QUAY
      #   run: exec buildah login -u ${{ secrets.QUAY_USER }} -p ${{ secrets.QUAY_TOKEN }} quay.io

      - name: Login to Docker Hub
        if: env.PUSH_DOCKER_HUB
        run: exec buildah login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_TOKEN }} docker.io

      - name: Publish ${{ matrix.TYPE }}-${{ matrix.TAG }} (amd64 + arm64)
        run: just ci-publish ${{ matrix.TYPE }} ${{ matrix.TAG }}

  # nektos/act's own test suite against the published (multi-arch) act image
  test:
    name: Test act:${{ matrix.TAG }}
    needs: [publish-base]
    if: (!cancelled())
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        TAG:
          - 26.04
          - 24.04
          - 22.04
    steps:
      - if: env.SKIP_TEST != 'true'
        uses: actions/checkout@v7

      - if: env.SKIP_TEST != 'true'
        uses: ./.github/actions/setup-build

      - if: env.SKIP_TEST != 'true'
        uses: actions/checkout@v7
        with:
          repository: nektos/act
          path: act

      - if: env.SKIP_TEST != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: act/go.mod
          cache-dependency-path: act/go.sum

      # TestRunDifferentArchitecture runs the arm64 variant of the image
      - if: env.SKIP_TEST != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Login docker to GitHub Container Registry
        if: env.SKIP_TEST != 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - if: env.SKIP_TEST != 'true'
        env:
          ACT_SRC: ${{ github.workspace }}/act
        run: just test ghcr.io/${{ env.SLUG }}:act-${{ matrix.TAG }}-${{ env.PART_TAG }}
