name: Set up image build
description: >-
  Checks the runner's buildah, sets up QEMU, installs Ansible and just, and exports
  SLUG (lowercased), PART_TAG and PUSH_DEFAULT for the justfile. Requires the repository to be checked out.

runs:
  using: composite
  steps:
    - name: Disable apparmor restrictions
      shell: sh
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # The ubuntu-26.04 runner ships buildah (1.42+), which strips the user.overlay.* xattrs that broke
    # `docker pull` of images built with older buildah (catthehacker/docker_images#122); it was
    # previously compiled from source (v1.35.0) for that reason.
    - name: Check buildah
      shell: bash
      run: |
        buildah --version
        # rootless networking for `buildah run`
        if ! command -v pasta >/dev/null; then
          sudo apt-get -y -qq update
          sudo apt-get -y install passt
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Install Ansible and just
      shell: bash
      run: |
        pipx install ansible-core
        pipx install rust-just
        ansible-galaxy collection install -r ansible/requirements.yml

    - name: Export SLUG, PART_TAG and PUSH_DEFAULT
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        echo "SLUG=${SLUG,,}" | tee -a "$GITHUB_ENV"
        if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
          echo "PART_TAG=$(date +%Y%m%d)" | tee -a "$GITHUB_ENV"
        else
          echo "PART_TAG=dev" | tee -a "$GITHUB_ENV"
        fi
        # Un-suffixed tags (act-24.04, act-latest) are only pushed by scheduled / manual runs, never under nektos/act
        if [[ "$EVENT" != pull_request && "$EVENT" != push && -z "${ACT:-}" ]]; then
          echo "PUSH_DEFAULT=1" | tee -a "$GITHUB_ENV"
        fi
